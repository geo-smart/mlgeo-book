name: leaderboard

on:
  pull_request:
    paths: ["results/**", "leaderboard/**", ".github/workflows/leaderboard.yaml"]
  push:
    branches: [main]
    paths: ["results/**", "leaderboard/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
          post-cleanup: false

      - name: Score submissions
        run: pixi run python leaderboard/score.py

      - name: Show standings in job summary
        run: cat book/leaderboard_standings.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated standings (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"
          git add book/leaderboard_standings.md
          git diff --cached --quiet || git commit -m "leaderboard: update standings [skip ci]"
          git push
