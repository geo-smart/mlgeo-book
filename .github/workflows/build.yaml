name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 2026-edition]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
          post-cleanup: false

      - name: Execute all notebooks (sequential — myst's concurrent kernels OOM the runner)
        run: pixi run python tools/execute_notebooks.py

      - name: Build book from executed notebooks
        run: pixi run myst build --html
        working-directory: book
        env:
          BASE_URL: /mlgeo-book

      - name: Redirect stubs for old (2024 edition) URLs
        run: pixi run python tools/make_redirects.py

      - name: Link check
        run: pixi run myst build --check-links
        working-directory: book
        continue-on-error: true

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
