name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 2026-edition]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
          post-cleanup: false

      # Fails the build if a translated page drifts from its English source:
      # code cells (source, outputs, metadata), plain code fences, and
      # toc<->MANIFEST coverage must all match. Runs before the expensive
      # notebook execution so a drift fails fast.
      - name: Check translation integrity
        run: pixi run python tools/check_translations.py

      - name: Execute all notebooks (sequential — myst's concurrent kernels OOM the runner)
        run: pixi run python tools/execute_notebooks.py

      - name: Build book from executed notebooks
        run: pixi run myst build --html
        working-directory: book
        env:
          BASE_URL: /mlgeo-book

      - name: Redirect stubs for old (2024 edition) URLs
        run: pixi run python tools/make_redirects.py

      # Pilot translations (Chapter 1 + front matter). Notebooks ship with
      # committed outputs (1.7 is data-localized and pre-executed), so no
      # notebook execution here — build only, then graft under /fr/ and /es/.
      - name: Build French pilot edition
        run: pixi run myst build --html
        working-directory: translations/fr
        env:
          BASE_URL: /mlgeo-book/fr
      - name: Build Spanish pilot edition
        run: pixi run myst build --html
        working-directory: translations/es
        env:
          BASE_URL: /mlgeo-book/es
      - name: Graft translated editions into the site
        run: |
          cp -R translations/fr/_build/html book/_build/html/fr
          cp -R translations/es/_build/html book/_build/html/es

      - name: Publish lecture decks into the site under /slides/
        run: |
          mkdir -p book/_build/html/slides
          cp -R book/slides/2026 book/_build/html/slides/2026
          cp book/slides/*.pdf book/_build/html/slides/ 2>/dev/null || true

      - name: Link check
        run: pixi run myst build --check-links
        working-directory: book
        continue-on-error: true

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
