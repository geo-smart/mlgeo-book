  # Language switcher — translated editions built under /fr/ and /es/ by CI
  # (see .github/workflows/build.yaml and translations/{fr,es}/myst.yml).
  nav:
    - title: 🇫🇷 Français
      url: https://geo-smart.github.io/mlgeo-book/fr/
    - title: 🇪🇸 Español
      url: https://geo-smart.github.io/mlgeo-book/es/
  options:
    logo: img/GeoSMART_logo.svg
    logo_dark: img/GeoSMART_logo.svg
    favicon: img/GeoSMART_logo.svg
