# MyST / Jupyter Book 2 configuration for the MLGeo book (2026 edition)
# Replaces the legacy Jupyter Book v1 _config.yml + _toc.yml
version: 1
project:
  id: mlgeo-book
  title: Machine Learning in the Geosciences
  description: >-
    Curriculum book for ESS 469/569 (MLGeo) at the University of Washington —
    AI-ready geoscience data, classic machine learning, deep learning, and
    working with agentic AI in scientific practice.
  authors:
    - name: Marine Denolle
      affiliation: University of Washington
  github: https://github.com/geo-smart/mlgeo-book
  license:
    content: CC-BY-4.0
    code: MIT
  bibliography:
    - reference/references.bib
  exports: []
  toc:
