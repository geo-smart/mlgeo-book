[workspace]
name = "mlgeo-book"
version = "2.0.0"
description = "MLGeo curriculum book (2026 edition) — pinned build & execution environment"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Executing every notebook takes many minutes. Use the -fast variants while
# editing prose, links, or the toc — they render the outputs already committed
# in the .ipynb files, which is what the published site shows anyway. Run the
# executing variants before publishing, or when you changed code.
vscode-kernel = "python -m ipykernel install --user --name mlgeo-book --display-name \"Python (mlgeo-book pixi)\""
build = { cmd = "myst build --execute --html", cwd = "book" }
build-fast = { cmd = "myst build --html", cwd = "book" }
serve = { cmd = "myst start --execute", cwd = "book" }
serve-fast = { cmd = "myst start", cwd = "book" }
check-links = { cmd = "myst build --check-links", cwd = "book" }
test-synth = { cmd = "pytest book/mlgeo_synth/tests -q" }

# Translated editions. These never execute: their notebooks carry the English
# edition's committed outputs (except the data-localized 1.7), and executing
# them would break that invariant.
build-fr = { cmd = "myst build --html", cwd = "translations/fr", env = { BASE_URL = "/mlgeo-book/fr" } }
build-es = { cmd = "myst build --html", cwd = "translations/es", env = { BASE_URL = "/mlgeo-book/es" } }
serve-fr = { cmd = "myst start", cwd = "translations/fr" }
serve-es = { cmd = "myst start", cwd = "translations/es" }

# Quality gates, same ones CI runs.
check = { depends-on = ["check-translations", "lint-terminology", "check-typos"] }
check-translations = "python tools/check_translations.py"
lint-terminology = "python tools/lint_terminology.py"
check-typos = "python tools/check_prose_typos.py"
persona-status = "python tools/persona_status.py"

[dependencies]
python = "3.12.*"
numpy = ">=2.0"
pandas = ">=2.2"
scipy = ">=1.15"
scikit-learn = ">=1.6"
pytorch = ">=2.4"
torchvision = "*"
obspy = ">=1.4"
xarray = "*"
netcdf4 = "*"
h5py = "*"
zarr = "*"
geopandas = "*"
rasterio = "*"
matplotlib = ">=3.9"
seaborn = "*"
plotly = ">=6"
statsmodels = "*"
lightgbm = "*"
optuna = "*"
pywavelets = "*"
pooch = "*"
pyarrow = "*"
folium = "*"
scikit-image = "*"
tqdm = "*"
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"
jupytext = "*"
pytest = "*"
nodejs = ">=20"
dask = ">=2026.7.1,<2027"
s3fs = ">=2026.6.0,<2027"

[pypi-dependencies]
mlgeo-synth = { path = ".", editable = true }
mystmd = ">=1.3"
tsfel = "*"
seisbench = "*"
torchinfo = "*"

# A lean environment for the Chapter 2 notebooks and the Session 7 labs: the
# scientific Python core, xarray/netCDF and ObsPy, without PyTorch, the GIS
# stack or the build tools (about 850 MB against 2.3 GB). numpy and Python are
# pinned to the versions of the full environment, and the other shared packages
# resolve to the same versions, so a notebook gives the same numbers in both.
#   pixi run -e core jupyter lab
[feature.core.dependencies]
python = "==3.12.15"
numpy = "==2.5.3"
pandas = ">=2.2"
scipy = ">=1.15"
scikit-learn = ">=1.6"
matplotlib = ">=3.9"
xarray = "*"
netcdf4 = "*"
obspy = ">=1.4"
requests = "*"
pooch = "*"
pyyaml = "*"
jupyterlab = "*"
ipykernel = "*"

[feature.core.pypi-dependencies]
mlgeo-synth = { path = ".", editable = true }

[environments]
core = { features = ["core"], no-default-feature = true }
