[workspace]
name = "mlgeo-book"
version = "2.0.0"
description = "MLGeo curriculum book (2026 edition) — pinned build & execution environment"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
build = "myst build --execute --html"
serve = "myst start --execute"
check-links = "myst build --check-links"
test-synth = "pytest book/mlgeo_synth/tests -q"

[dependencies]
python = "3.12.*"
numpy = ">=2.0"
pandas = ">=2.2"
scipy = ">=1.15"
scikit-learn = ">=1.6"
pytorch = ">=2.4"
torchvision = "*"
obspy = ">=1.4"
xarray = "*"
netcdf4 = "*"
h5py = "*"
zarr = "*"
geopandas = "*"
rasterio = "*"
matplotlib = ">=3.9"
seaborn = "*"
plotly = ">=6"
statsmodels = "*"
lightgbm = "*"
optuna = "*"
pywavelets = "*"
pooch = "*"
pyarrow = "*"
folium = "*"
scikit-image = "*"
tqdm = "*"
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"
jupytext = "*"
pytest = "*"
nodejs = ">=20"

[pypi-dependencies]
mlgeo-synth = { path = ".", editable = true }
mystmd = ">=1.3"
tsfel = "*"
seisbench = "*"
torchinfo = "*"
