[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlgeo-synth"
version = "2.0.0"
description = "Physically motivated synthetic data generators for the MLGeo book"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.15"]

[tool.setuptools]
package-dir = { "" = "book" }
packages = ["mlgeo_synth"]
