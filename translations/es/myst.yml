# MyST / Jupyter Book 2 configuration for the Spanish pilot edition
# (Chapter 1 + front matter; the English edition is authoritative).
# CI builds this site under /es/ on the main book's GitHub Pages
# (see .github/workflows/build.yaml). Readers switch languages via the
# flag links in site.nav — keep them consistent with book/myst.yml and
# translations/fr/myst.yml.
version: 1
project:
  id: mlgeo-book-es
  title: Machine Learning en las Geociencias
  description: >-
    Edición piloto en español del libro MLGeo (ESS 469/569, Universidad de
    Washington) — capítulo 1 y páginas preliminares. La edición en inglés es
    la autoritativa; el código, las salidas ejecutadas y las figuras se
    mantienen idénticos al original (el cuaderno 1.7 usa estaciones GNSS
    mexicanas).
  authors:
    - name: Marine Denolle
      affiliation: University of Washington
  github: https://github.com/geo-smart/mlgeo-book
  license:
    content: CC-BY-4.0
    code: MIT
  exports: []
  toc:
    - file: about_this_book/about_this_book.md
    - title: Capítulo 1 — El ecosistema de código abierto
      children:
        - file: Chapter1-GettingStarted/readme.md
        - file: Chapter1-GettingStarted/1.1_open_reproducible_science.md
        - file: Chapter1-GettingStarted/1.2_jupyter_environment.md
        - file: Chapter1-GettingStarted/1.3_python_environment.md
        - file: Chapter1-GettingStarted/1.4_computational_environments.md
        - file: Chapter1-GettingStarted/1.5_version_control_git.md
        - file: Chapter1-GettingStarted/1.6_data_gallery.md
        - file: Chapter1-GettingStarted/1.7_get_geodetic_gnss.ipynb
        - file: Chapter1-GettingStarted/1.8_ai_in_your_workflow.md
        - file: Chapter1-GettingStarted/1.9_workbench_setup_hw1.md
site:
  template: book-theme
  nav:
    - title: 🇺🇸 English
      url: https://geo-smart.github.io/mlgeo-book/
    - title: 🇫🇷 Français
      url: https://geo-smart.github.io/mlgeo-book/fr/
