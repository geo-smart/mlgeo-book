# Manifiesto de la edición en español — libro completo
# Cada entrada registra el archivo traducido, su fuente inglesa autoritativa y
# el commit de la fuente sobre el cual se basó la traducción
# (git log -1 --format=%H -- <archivo-fuente>).
# CI compara estos hashes con la historia actual para detectar traducciones obsoletas.

language: es
edition: 2026
scope: full-book
notes: >
  Cuaderno 1.7 localizado con datos mexicanos (estaciones OAX2 y MERI de la
  Red Geodésica Nacional Activa del INEGI, procesadas por el Nevada Geodetic
  Laboratory) y re-ejecutado; sus salidas difieren deliberadamente de la
  edición inglesa. Todos los demás archivos son traducciones de prosa sin
  cambios de código.
  2026-08-13: traducción del libro completo (capítulos 2–7, páginas
  preliminares y glosario) más una pasada de revisión por IA contra las cinco
  personas sintéticas hispanohablantes (recurso de diseño, no revisión
  comunitaria; véase docs/REVIEW_RECORD.md). La prosa está localizada (SSN, SASMEX, CONAGUA, Protección
  Civil, cuencas del Grijalva, asignaciones de cómputo iberoamericanas en 5.4);
  el código, las salidas y las figuras siguen siendo idénticos al inglés,
  verificado por tools/check_translations.py.

