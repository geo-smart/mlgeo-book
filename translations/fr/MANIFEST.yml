  stations GRAS and BRST) and re-executed; its outputs intentionally differ
  from the English edition. All other code and outputs match the English
  edition. Prose follows French typographic conventions (see the note at the
  top of Chapter1-GettingStarted/readme.md).
  2026-08-12 second AI review pass against synthetic personas 06-08 (Marchand/ML,
  Caron/prose+portals, Payré/TP+Epos-France): surgical prose and terminology
  fixes across all Chapter 1 files plus about_this_book — anglicized syntax,
  community-standard terms (solveur, workflow, job, build), Jean Zay added to
  the GENCI list in 1.4, GRAS/Calern wording and a RENAG-Alpes forward pointer
  in 1.7 (see its per-file note). Prose only; code, commands, and outputs
  untouched.
  2026-08-13: full-book translation (chapters 2-7, front matter, glossary)
  plus an AI review pass against the synthetic personas over every chapter
  (design aid, not community review - see docs/REVIEW_RECORD.md). Prose is localized (Alpine
  and Cevennes examples, Meteo-France, Epos-France/RENAG, BRGM, Data Terra,
  Securite civile, GENCI/Jean Zay and EuroHPC in 5.4); code, outputs, and
  figures remain identical to the English edition, verified by
  tools/check_translations.py.
