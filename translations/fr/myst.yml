# MyST / Jupyter Book 2 configuration for the French edition
# (full book; the English edition is authoritative).
# CI builds this site under /fr/ on the main book's GitHub Pages
# (see .github/workflows/build.yaml). Readers switch languages via the
# flag links in site.nav — keep them consistent with book/myst.yml and
# translations/es/myst.yml.
version: 1
project:
  id: mlgeo-book-fr
  title: L'apprentissage automatique en géosciences
  description: >-
    Édition française du livre MLGeo (ESS 469/569, Université de Washington).
    L'édition anglaise fait foi ; code, sorties exécutées et figures restent
    identiques à l'original (le carnet 1.7 utilise des stations GNSS
    françaises). La prose est localisée : exemples, institutions et
    infrastructures de données européennes.
  authors:
    - name: Marine Denolle
      affiliation: University of Washington
  github: https://github.com/geo-smart/mlgeo-book
  license:
    content: CC-BY-4.0
    code: MIT
